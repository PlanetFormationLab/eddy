[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-eddy"
version = "2.4.1"
authors = [
    { name = "Richard Teague", email = "rteague@mit.edu" }
]
description = "Tools to study the dynamics of protoplanetary disks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "scipy>=1.7",
    "numpy>=2.0",
    "jax>=0.4",
    "jaxlib>=0.4",
    "tinygp>=0.3",
    "matplotlib>=3",
    "emcee>=3",
    "corner>=2",
    "zeus-mcmc>=2",
    "numpyro>=0.15",
    "bettermoments>=1.9.6",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/PlanetFormationLab/eddy"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that take more than a few seconds (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eddy*"]

[tool.setuptools.package-data]
eddy = ["*.yml"]
